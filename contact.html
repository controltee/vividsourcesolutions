<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/js/theme-init.js"></script>
    <title>Contact — Control Tee</title>
    <meta
      name="description"
      content="Start a project with Control Tee — a design studio in Nairobi. Brand identity, event branding, motion and video."
    />
    <link
      rel="preload"
      href="/fonts/CabinetGrotesk-Extrabold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/about.css" />
    <link rel="stylesheet" href="/css/contact.css" />
    <script type="module" src="/js/shell.js"></script>
    <script type="module" src="/js/contact.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#pane">Skip to content</a>

    <header class="topbar">
      <a class="topbar__brand" href="/">Control Tee</a>
      <button
        class="topbar__toggle"
        id="rail-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="rail"
        aria-label="Open menu"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
    </header>

    <div class="scrim" id="scrim"></div>

    <div class="shell">
      <aside class="rail" id="rail">
        <div class="rail__head">
          <a class="rail__brand" href="/">Control Tee</a>
          <p class="rail__tagline" id="brand-tagline" hidden></p>
        </div>

        <nav class="rail__nav" id="rail-nav" aria-label="Projects">
          <!-- rendered by shell.js -->
        </nav>

        <footer class="rail__foot">
          <a href="/about.html">About</a>
          <a href="/contact.html" id="contact-link" aria-current="page">Contact</a>
          <ul class="rail__social">
            <li>
              <a
                href="https://www.instagram.com/control.tee/"
                data-social="instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Instagram"
                >Instagram</a
              >
            </li>
            <li>
              <a
                href="https://www.behance.net/controltee"
                data-social="behance"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Behance"
                >Behance</a
              >
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/controltee/"
                data-social="linkedin"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on LinkedIn"
                >LinkedIn</a
              >
            </li>
          </ul>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true">◑</span>
            <span class="theme-toggle__label">Light mode</span>
          </button>
          <time class="rail__clock" id="rail-clock" aria-label="Current time in Nairobi"></time>
        </footer>
      </aside>

      <main class="pane" id="pane" tabindex="-1">
        <h1 class="pane__title">Start a project</h1>
        <p class="about__body" id="contact-intro">
          Tell us what you have in mind — a campaign, an identity, or a story
          that needs to move — and we’ll get back to you.
        </p>

        <form class="inquiry" id="inquiry-form" novalidate>
          <div class="inquiry__row">
            <label class="inquiry__field">
              <span class="inquiry__label">Your name</span>
              <input class="inquiry__input" name="name" type="text" required autocomplete="name" />
            </label>
            <label class="inquiry__field">
              <span class="inquiry__label">Email</span>
              <input class="inquiry__input" name="email" type="email" required autocomplete="email" />
            </label>
          </div>

          <div class="inquiry__row">
            <label class="inquiry__field">
              <span class="inquiry__label">Company <span class="inquiry__optional">(optional)</span></span>
              <input class="inquiry__input" name="company" type="text" autocomplete="organization" />
            </label>
            <label class="inquiry__field">
              <span class="inquiry__label">What do you need?</span>
              <select class="inquiry__input" name="service">
                <option value="Brand identity">Brand identity</option>
                <option value="Event branding">Event branding</option>
                <option value="Social &amp; marketing campaign">Social &amp; marketing campaign</option>
                <option value="Motion design">Motion design</option>
                <option value="Video production">Video production</option>
                <option value="Something else">Something else</option>
              </select>
            </label>
          </div>

          <label class="inquiry__field">
            <span class="inquiry__label">Tell us about the project</span>
            <textarea class="inquiry__input inquiry__textarea" name="message" required rows="6"></textarea>
          </label>

          <!-- Honeypot: bots fill this, people never see it. -->
          <input
            class="inquiry__botcheck"
            type="checkbox"
            name="botcheck"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
          />

          <div class="inquiry__actions">
            <button class="inquiry__submit" type="submit">Send inquiry</button>
            <p class="inquiry__status" id="inquiry-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
