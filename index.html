<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/js/theme-init.js"></script>
    <title>Control Tee · Nairobi design studio</title>
    <meta
      name="description"
      content="Control Tee is a design studio in Nairobi. Brand identity, event branding, motion and video."
    />
    <link
      rel="preload"
      href="/fonts/CabinetGrotesk-Extrabold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <script type="module" src="/js/shell.js"></script>
    <script type="module" src="/js/home.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#pane">Skip to content</a>

    <!-- Mobile only (hidden on desktop by shell.css) -->
    <header class="topbar">
      <a class="topbar__brand" href="/">Control Tee</a>
      <button
        class="topbar__toggle"
        id="rail-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="rail"
        aria-label="Open menu"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
    </header>

    <div class="scrim" id="scrim"></div>

    <div class="shell">
      <aside class="rail" id="rail">
        <div class="rail__head">
          <a class="rail__brand" href="/">Control Tee</a>
          <p class="rail__tagline" id="brand-tagline" hidden></p>
        </div>

        <nav class="rail__nav" id="rail-nav" aria-label="Projects">
          <!-- rendered by shell.js -->
        </nav>

        <footer class="rail__foot">
          <a href="/about.html">About</a>
          <a href="/contact.html" id="contact-link">Contact</a>
          <ul class="rail__social">
            <li>
              <a
                href="https://www.instagram.com/control.tee/"
                data-social="instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Instagram"
                >Instagram</a
              >
            </li>
            <li>
              <a
                href="https://www.behance.net/controltee"
                data-social="behance"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Behance"
                >Behance</a
              >
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/controltee/"
                data-social="linkedin"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on LinkedIn"
                >LinkedIn</a
              >
            </li>
          </ul>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true">◑</span>
            <span class="theme-toggle__label">Light mode</span>
          </button>
          <time class="rail__clock" id="rail-clock" aria-label="Current time in Nairobi"></time>
          <ul class="rail__legal">
            <li><a href="/privacy.html">Privacy</a></li>
            <li><a href="/terms.html">Terms</a></li>
            <li><a href="/cookies.html">Cookies</a></li>
          </ul>
        </footer>
      </aside>

      <main class="pane" id="pane" tabindex="-1">
        <!-- Studio synopsis. Populated by home.js from the same site_content
             rows the About page uses, so it stays editable in /admin with no
             redeploy. Starts hidden so an empty band never flashes; if the
             fetch fails it simply stays hidden and the work still renders. -->
        <section class="home-intro" id="home-intro" hidden>
          <h1 class="home-intro__title" id="home-intro-title"></h1>
          <!-- Decorative word cycle. aria-hidden: the h1 already names the
               studio, and a looping animation announced to a screen reader
               would be noise rather than information. -->
          <p class="home-intro__cycle" aria-hidden="true">
            <span class="home-intro__word">Creativity</span>
            <span class="home-intro__word">Transformation</span>
          </p>
          <p class="home-intro__body" id="home-intro-body"></p>
          <p class="home-intro__actions">
            <a class="home-intro__cta" href="#work-heading">View selected work</a>
            <a class="home-intro__more" href="/about.html">More about the studio</a>
          </p>
        </section>

        <h2 class="pane__title" id="work-heading">Selected work</h2>
        <div class="project-grid" id="project-grid" aria-busy="true">
          <!-- rendered by home.js -->
        </div>
      </main>
    </div>
  </body>
</html>
