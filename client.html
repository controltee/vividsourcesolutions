<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/js/theme-init.js"></script>
    <title>Client · Control Tee</title>
    <meta name="description" content="Work by Control Tee for this client." />
    <link
      rel="preload"
      href="/fonts/CabinetGrotesk-Extrabold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <!-- Deliberately reuses home.css: this page is the home grid, filtered to
         one client. A separate stylesheet would mean two card designs drifting
         apart. -->
    <link rel="stylesheet" href="/css/home.css" />
    <script type="module" src="/js/shell.js"></script>
    <script type="module" src="/js/client.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#pane">Skip to content</a>

    <!-- Mobile only (hidden on desktop by shell.css) -->
    <header class="topbar">
      <a class="topbar__brand" href="/">Control Tee</a>
      <button
        class="topbar__toggle"
        id="rail-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="rail"
        aria-label="Open menu"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
    </header>

    <div class="scrim" id="scrim"></div>

    <div class="shell">
      <aside class="rail" id="rail">
        <div class="rail__head">
          <a class="rail__brand" href="/">Control Tee</a>
          <p class="rail__tagline" id="brand-tagline" hidden></p>
        </div>

        <nav class="rail__nav" id="rail-nav" aria-label="Projects">
          <!-- rendered by shell.js -->
        </nav>

        <footer class="rail__foot">
          <a href="/about.html">About</a>
          <a href="/contact.html" id="contact-link">Contact</a>
          <ul class="rail__social">
            <li>
              <a
                href="https://www.instagram.com/control.tee/"
                data-social="instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Instagram"
                >Instagram</a
              >
            </li>
            <li>
              <a
                href="https://www.behance.net/controltee"
                data-social="behance"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Behance"
                >Behance</a
              >
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/controltee/"
                data-social="linkedin"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on LinkedIn"
                >LinkedIn</a
              >
            </li>
          </ul>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true">◑</span>
            <span class="theme-toggle__label">Light mode</span>
          </button>
          <time class="rail__clock" id="rail-clock" aria-label="Current time in Nairobi"></time>
          <ul class="rail__legal">
            <li><a href="/privacy.html">Privacy</a></li>
            <li><a href="/terms.html">Terms</a></li>
            <li><a href="/cookies.html">Cookies</a></li>
          </ul>
        </footer>
      </aside>

      <main class="pane" id="pane" tabindex="-1">
        <!-- rendered by client.js -->
      </main>
    </div>
  </body>
</html>
