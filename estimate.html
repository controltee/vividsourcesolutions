<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/js/theme-init.js"></script>
    <title>Estimate your project · Control Tee</title>
    <meta
      name="description"
      content="Start a project with Control Tee, a design studio in Nairobi. Brand identity, event branding, motion and video."
    />
    <link
      rel="preload"
      href="/fonts/CabinetGrotesk-Extrabold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/estimate.css" />
    <script type="module" src="/js/shell.js"></script>
    <script type="module" src="/js/estimate.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#pane">Skip to content</a>

    <header class="topbar">
      <a class="topbar__brand" href="/">Control Tee</a>
      <button
        class="topbar__toggle"
        id="rail-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="rail"
        aria-label="Open menu"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
    </header>

    <div class="scrim" id="scrim"></div>

    <div class="shell">
      <aside class="rail" id="rail">
        <div class="rail__head">
          <a class="rail__brand" href="/">Control Tee</a>
          <p class="rail__tagline" id="brand-tagline" hidden></p>
        </div>

        <nav class="rail__nav" id="rail-nav" aria-label="Projects">
          <!-- rendered by shell.js -->
        </nav>

        <footer class="rail__foot">
          <a href="/about.html">About</a>
          <a href="/contact.html" id="contact-link" aria-current="page">Contact</a>
          <ul class="rail__social">
            <li>
              <a
                href="https://www.instagram.com/control.tee/"
                data-social="instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Instagram"
                >Instagram</a
              >
            </li>
            <li>
              <a
                href="https://www.behance.net/controltee"
                data-social="behance"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on Behance"
                >Behance</a
              >
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/controltee/"
                data-social="linkedin"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Control Tee on LinkedIn"
                >LinkedIn</a
              >
            </li>
          </ul>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true">◑</span>
            <span class="theme-toggle__label">Light mode</span>
          </button>
          <time class="rail__clock" id="rail-clock" aria-label="Current time in Nairobi"></time>
          <ul class="rail__legal">
            <li><a href="/privacy.html">Privacy</a></li>
            <li><a href="/terms.html">Terms</a></li>
            <li><a href="/cookies.html">Cookies</a></li>
          </ul>
        </footer>
      </aside>

      <main class="pane" id="pane" tabindex="-1">
        <section class="estimate" aria-labelledby="estimate-heading">
          <h1 class="estimate__title" id="estimate-heading">Estimate your project</h1>
          <p class="estimate__lede">
            Three questions, then a thirty-minute call. We quote once we understand the
            project — a figure guessed from a form would only have to be revised.
          </p>

          <!-- Built by js/estimate.js. Static fallback below covers a visitor
               with JavaScript disabled, who would otherwise get a dead page
               where the site's only call to action points. -->
          <div class="estimate__app" id="estimate-app" hidden></div>

          <noscript>
            <p class="estimate__lede">
              The estimator needs JavaScript. Send us the brief instead and we will come back
              with a figure — <a href="/contact.html">use the contact form</a>.
            </p>
          </noscript>
        </section>
      </main>
    </div>
  </body>
</html>
